name: Certum connect
description: Log in to the Certum token and export $SS_PKCS11. Run in the certum-signer image with CERTUM_USER_ID and CERTUM_OTP_URI set.

inputs:
  launch-seconds:
    description: 'Most seconds to wait for SimplySign to show its login window.'
    required: false
    default: '90'

runs:
  using: composite
  steps:
    - name: Connect SimplySign (headless login)
      shell: bash
      env:
        LAUNCH_SECONDS: ${{ inputs.launch-seconds }}
      run: dotnet run --file "$GITHUB_ACTION_PATH/certum-connect.cs" -- "$LAUNCH_SECONDS"
