name: Set up .NET SDKs
description: Install the requested SDKs or the SDK from global.json.
inputs:
  dotnet-version:
    description: Newline-separated SDK versions.
    required: false
    default: ''
  global-json-file:
    description: Path to global.json in the caller checkout.
    required: false
    default: ''
  dotnet-quality:
    description: SDK quality passed to setup-dotnet.
    required: false
    default: ''
runs:
  using: composite
  steps:
  - name: Install SDKs
    uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
    with:
      dotnet-version: ${{ inputs.dotnet-version }}
      global-json-file: ${{ inputs.global-json-file }}
      dotnet-quality: ${{ inputs.dotnet-quality }}
