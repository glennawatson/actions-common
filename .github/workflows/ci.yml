name: Verify shared actions
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: ./.github/actions/setup-sdk
      with:
        dotnet-version: 11.0.x
    - uses: ./.github/actions/run-csharp
      with:
        script-file: tools/Verify.cs
