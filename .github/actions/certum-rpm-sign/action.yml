name: Certum RPM signing
description: Add IMA file signatures to RPMs with the Certum token. Run certum-connect earlier in the job.

inputs:
  packages-glob:
    description: 'Glob of .rpm files to sign (relative to the working directory).'
    required: false
    default: 'signed/*.rpm'

runs:
  using: composite
  steps:
    - name: Sign RPM files with the token
      shell: bash
      env:
        PKG_GLOB: ${{ inputs.packages-glob }}
      run: dotnet run --file "$GITHUB_ACTION_PATH/certum-rpm-sign.cs" -- "$PKG_GLOB"
