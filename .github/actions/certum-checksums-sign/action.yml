name: Certum checksums signing
description: Write SHA256SUMS for release files and sign it with the Certum token as SHA256SUMS.p7s. Run in the certum-signer image.

inputs:
  files-glob:
    description: 'Glob of the release files; SHA256SUMS and SHA256SUMS.p7s are written beside them.'
    required: true
  certificate-from:
    description: 'A file jsign signed with the same certificate (.exe, .dll, .msi or .msix); the certificate is read from it.'
    required: true
  launch-seconds:
    description: 'Most seconds to wait for SimplySign to show its login window.'
    required: false
    default: '90'

runs:
  using: composite
  steps:
    - name: Connect SimplySign
      uses: glennawatson/actions-common/.github/actions/certum-connect@main
      with:
        launch-seconds: ${{ inputs.launch-seconds }}

    - name: Write and sign SHA256SUMS
      shell: bash
      env:
        FILES_GLOB: ${{ inputs.files-glob }}
        CERTIFICATE_FROM: ${{ inputs.certificate-from }}
      run: dotnet run --file "$GITHUB_ACTION_PATH/certum-checksums-sign.cs" -- "$FILES_GLOB" "$CERTIFICATE_FROM"
