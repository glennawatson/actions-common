name: Publish Certum signer image

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
  push:
    branches: [main]
    paths:
      - 'docker/certum-signer/**'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/reactiveui/certum-signer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET Environment
        uses: glennawatson/actions-common/.github/actions/dotnet-environment@main
        with:
          stamp-version: 'false'

      - name: Log in to GHCR, build and push image
        uses: glennawatson/actions-common/.github/actions/container-image-publish@main
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ env.IMAGE }}
          context: docker/certum-signer
