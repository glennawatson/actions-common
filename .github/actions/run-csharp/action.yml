name: Run a C# file
description: Run a C# file with .NET from the runner's temporary folder.
inputs:
  script-file:
    description: Absolute C# path or a path relative to the caller checkout.
    required: false
    default: ''
  shared-script:
    description: C# path relative to this action's scripts folder.
    required: false
    default: ''
  arguments:
    description: Newline-separated arguments.
    required: false
    default: ''
outputs:
  sha:
    description: Source commit SHA written by the script.
    value: ${{ steps.run.outputs.sha }}
  version:
    description: Computed release version written by the script.
    value: ${{ steps.run.outputs.version }}
  tag:
    description: Release tag written by the script.
    value: ${{ steps.run.outputs.tag }}
  prerelease:
    description: Whether the release is a prerelease.
    value: ${{ steps.run.outputs.prerelease }}
  SemVer2:
    description: Full MinVer semantic version.
    value: ${{ steps.run.outputs.SemVer2 }}
  SimpleVersion:
    description: MinVer major.minor.patch version.
    value: ${{ steps.run.outputs.SimpleVersion }}
  NuGetPackageVersion:
    description: MinVer version without build metadata.
    value: ${{ steps.run.outputs.NuGetPackageVersion }}
  GitCommitId:
    description: MinVer source commit SHA.
    value: ${{ steps.run.outputs.GitCommitId }}
  VersionHeight:
    description: MinVer commits since the version tag.
    value: ${{ steps.run.outputs.VersionHeight }}
runs:
  using: composite
  steps:
  - name: Run C#
    id: run
    shell: dotnet run --file {0}
    working-directory: ${{ runner.temp }}
    env:
      ACTION_PATH: ${{ github.action_path }}
      SCRIPT_FILE: ${{ inputs.script-file }}
      SHARED_SCRIPT: ${{ inputs.shared-script }}
      SCRIPT_ARGUMENTS: ${{ inputs.arguments }}
    run: |
      #!/usr/bin/env dotnet
      #:include ${{ env.ACTION_PATH }}/Run.cs
