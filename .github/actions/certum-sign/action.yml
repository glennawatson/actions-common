name: Certum SimplySign signing (prebuilt image)
description: |
  Sign files with a Certum "Code Signing in the Cloud" certificate.

  Certum SimplySign has no headless signing API: the cloud key is reachable only
  through the SimplySign Desktop GUI, which exposes it as a PKCS#11 token. This
  action runs that GUI headlessly (Xvfb + xdotool), logs in with the TOTP derived
  from the otpauth URI, then signs each package with jsign over PKCS#11 and
  verifies NuGet packages with `dotnet nuget verify`. A caller can supply a C#
  signing script for other artifact formats; that script owns verification and
  uses the same connected PKCS#11 session.

  MUST run inside the prebuilt certum-signer image (ghcr.io/reactiveui/certum-signer),
  which bakes in SimplySign Desktop, jsign, the .NET 10 and 11 SDKs, and the
  X11/PKCS#11 dependencies and exports $SS_DIST / $JSIGN_JAR. Credentials are read
  from the environment — composite actions cannot declare secret-typed inputs — so
  map these secrets into env on the calling job (standard secrets.* syntax):
    CERTUM_USER_ID            SimplySign login id
    CERTUM_OTP_URI            otpauth:// URI for the SimplySign TOTP
    CERTUM_CERT_FINGERPRINT   (optional) SHA-256 fingerprint to assert against
inputs:
  signing-script:
    description: 'Optional caller C# script to sign and verify artifacts using the connected PKCS#11 session.'
    required: false
    default: ''
  packages-glob:
    description: 'Glob of files to sign (relative to the working directory).'
    required: false
    default: 'signed/*.nupkg'
  timestamp-url:
    description: 'RFC3161 timestamp authority URL.'
    required: false
    default: 'http://time.certum.pl'
  launch-seconds:
    description: 'Seconds to wait after launching SimplySign before driving the UI.'
    required: false
    default: '20'
runs:
  using: composite
  steps:
  - name: Connect SimplySign
    uses: glennawatson/actions-common/.github/actions/certum-connect@main
    with:
      launch-seconds: ${{ inputs.launch-seconds }}
  - name: Sign packages with jsign + verify
    if: inputs.signing-script == ''
    env:
      TS_URL: ${{ inputs.timestamp-url }}
      PKG_GLOB: ${{ inputs.packages-glob }}
    uses: glennawatson/actions-common/.github/actions/run-csharp@main
    with:
      script-file: ${{ github.action_path }}/scripts/sign-packages-with-jsign---verify.cs
  - name: Sign and verify caller artifacts
    if: inputs.signing-script != ''
    env:
      TS_URL: ${{ inputs.timestamp-url }}
      PKG_GLOB: ${{ inputs.packages-glob }}
      JSIGN_SCRIPT: ${{ github.action_path }}/scripts/sign-packages-with-jsign---verify.cs
    uses: glennawatson/actions-common/.github/actions/run-csharp@main
    with:
      script-file: ${{ inputs.signing-script }}
