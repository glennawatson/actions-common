name: RPM build
description: Build an .rpm from a folder laid out as the installed file tree.

inputs:
  source:
    description: 'Folder laid out as the installed tree (for example stage, holding usr/...).'
    required: true
  output:
    description: 'The .rpm to write.'
    required: true
  name:
    description: 'Package name.'
    required: true
  version:
    description: 'Version; a pre-release suffix sorts before the release.'
    required: true
  release:
    description: 'Package release.'
    required: false
    default: '1'
  architecture:
    description: 'x86_64 or aarch64.'
    required: true
  summary:
    description: 'One-line summary.'
    required: true
  description:
    description: 'Longer description.'
    required: true
  license:
    description: 'Licence name, such as MIT.'
    required: true
  url:
    description: 'Project home page.'
    required: false
    default: ''
  vendor:
    description: 'Vendor.'
    required: false
    default: ''
  requires:
    description: 'Required packages, one per line, optionally with a version (name >= 1.0).'
    required: false
    default: ''
  recommends:
    description: 'Recommended packages, one per line.'
    required: false
    default: ''
  owned-directories:
    description: 'Directories the package owns, one per line; their subdirectories too. Others, such as /usr/bin, are left to the system.'
    required: false
    default: ''
  executables:
    description: 'Files to mark executable when building on Windows, one path or glob per line, relative to source. Other runners read the file modes.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Build RPM
      shell: bash
      env:
        RPM_SOURCE: ${{ inputs.source }}
        RPM_OUTPUT: ${{ inputs.output }}
        RPM_NAME: ${{ inputs.name }}
        RPM_VERSION: ${{ inputs.version }}
        RPM_RELEASE: ${{ inputs.release }}
        RPM_ARCH: ${{ inputs.architecture }}
        RPM_SUMMARY: ${{ inputs.summary }}
        RPM_DESCRIPTION: ${{ inputs.description }}
        RPM_LICENSE: ${{ inputs.license }}
        RPM_URL: ${{ inputs.url }}
        RPM_VENDOR: ${{ inputs.vendor }}
        RPM_REQUIRES: ${{ inputs.requires }}
        RPM_RECOMMENDS: ${{ inputs.recommends }}
        RPM_OWNED: ${{ inputs.owned-directories }}
        RPM_EXECUTABLES: ${{ inputs.executables }}
      run: dotnet run --file "$GITHUB_ACTION_PATH/rpm-build.cs"
