name: Certum SimplySign jsign signing (prebuilt image)
description: |
  Sign files with jsign and a Certum "Code Signing in the Cloud" certificate: NuGet packages (then checked with
  `dotnet nuget verify`) or Windows executables and installers (target-type authenticode).

  The token is connected by certum-connect, which runs the SimplySign Desktop GUI headlessly and logs in; jsign then
  signs each file over PKCS#11.

  MUST run inside the prebuilt certum-signer image (ghcr.io/reactiveui/certum-signer),
  which bakes in SimplySign Desktop, jsign, the .NET 10 and 11 SDKs, and the
  X11/PKCS#11 dependencies and exports $SS_DIST / $JSIGN_JAR. Credentials are read
  from the environment — composite actions cannot declare secret-typed inputs — so
  map these secrets into env on the calling job (standard secrets.* syntax):
    CERTUM_USER_ID            SimplySign login id
    CERTUM_OTP_URI            otpauth:// URI for the SimplySign TOTP
    CERTUM_CERT_FINGERPRINT   (optional) SHA-256 fingerprint to assert against

inputs:
  packages-glob:
    description: 'Glob of files to sign (relative to the working directory).'
    required: false
    default: 'signed/*.nupkg'
  target-type:
    description: 'What the files are: nuget (signed, then checked with dotnet nuget verify) or authenticode (Windows executables and installers, signed only).'
    required: false
    default: 'nuget'
  timestamp-url:
    description: 'RFC3161 timestamp authority URL.'
    required: false
    default: 'http://time.certum.pl'
  launch-seconds:
    description: 'Seconds to wait after launching SimplySign before driving the UI.'
    required: false
    default: '20'

runs:
  using: composite
  steps:
    - name: Connect SimplySign
      uses: glennawatson/actions-common/.github/actions/certum-connect@main
      with:
        launch-seconds: ${{ inputs.launch-seconds }}

    - name: Sign packages with jsign + verify
      shell: bash
      env:
        TS_URL: ${{ inputs.timestamp-url }}
        PKG_GLOB: ${{ inputs.packages-glob }}
        TARGET_TYPE: ${{ inputs.target-type }}
      run: |
        cd "$RUNNER_TEMP" && dotnet run - -- "$TS_URL" "$PKG_GLOB" "$TARGET_TYPE" <<'CS'
        using System.Diagnostics;
        using static System.Environment;

        if (args is not [var timestampUrl, var packagesGlob, var targetType])
        {
            Console.WriteLine("::error::Expected the timestamp URL, packages glob and target type arguments.");
            return 2;
        }

        if (targetType is not ("nuget" or "authenticode"))
        {
            Console.WriteLine($"::error::Unknown target type {targetType}; use nuget or authenticode.");
            return 2;
        }

        if (GetEnvironmentVariable("JSIGN_JAR") is not { Length: > 0 } jar)
        {
            Console.WriteLine("::error::The prebuilt certum-signer image must set JSIGN_JAR.");
            return 1;
        }

        var keystore = Path.Combine(GetEnvironmentVariable("RUNNER_TEMP")!, "sunpkcs11.conf");
        File.WriteAllLines(keystore, ["name = SimplySign", $"library = {GetEnvironmentVariable("SS_PKCS11")}", "slotListIndex = 0"]);

        Directory.SetCurrentDirectory(GetEnvironmentVariable("GITHUB_WORKSPACE")!);

        var folder = Path.GetDirectoryName(packagesGlob) is { Length: > 0 } directory ? directory : ".";
        string[] packages = Directory.Exists(folder) ? [.. Directory.GetFiles(folder, Path.GetFileName(packagesGlob)).Order(StringComparer.Ordinal)] : [];
        if (packages is [])
        {
            Console.WriteLine($"::error::no packages matched: {packagesGlob}");
            return 1;
        }

        foreach (var package in packages)
        {
            Console.WriteLine($"::group::sign {package}");

            // The keystore can report no certificate for a few seconds after login, so only that error is retried.
            // jsign auto-selects the token's single key; the RFC3161 timestamp outlives the certificate.
            for (var attempt = 1; ; attempt++)
            {
                var result = Process.RunAndCaptureText(
                    "java",
                    ["-jar", jar, "--storetype", "PKCS11", "--keystore", keystore, "--storepass", string.Empty, "--alg", "SHA-256", "--tsmode", "RFC3161", "--tsaurl", timestampUrl, "--replace", package]);

                var output = result.StandardOutput + result.StandardError;
                Console.WriteLine(output);

                if (result is { ExitStatus.ExitCode: 0 })
                {
                    break;
                }

                if (!output.Contains("No certificate found", StringComparison.Ordinal))
                {
                    return result.ExitStatus.ExitCode;
                }

                if (attempt is 15)
                {
                    Console.WriteLine("::error::keystore exposed no certificate to jsign");
                    return 1;
                }

                Console.WriteLine($"keystore not populated yet (attempt {attempt})");
                Thread.Sleep(TimeSpan.FromSeconds(4));
            }

            if (targetType is "nuget" && Process.Run("dotnet", ["nuget", "verify", package, "--all", "--verbosity", "detailed"]) is { ExitCode: not 0 } verify)
            {
                return verify.ExitCode;
            }

            Console.WriteLine("::endgroup::");
        }

        return 0;
        CS
