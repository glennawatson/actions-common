name: Run a command through .NET
description: Run a command with separate arguments through the .NET process APIs.
inputs:
  command:
    description: Executable to run.
    required: true
  arguments:
    description: Newline-separated arguments. Environment variables use $NAME or ${NAME}.
    default: ''
  working-directory:
    description: Directory relative to the caller checkout.
    default: '.'
runs:
  using: composite
  steps:
  - uses: glennawatson/actions-common/.github/actions/run-csharp@main
    env:
      COMMAND_FILE: ${{ inputs.command }}
      COMMAND_ARGUMENTS: ${{ inputs.arguments }}
      COMMAND_DIRECTORY: ${{ inputs.working-directory }}
    with:
      script-file: ${{ github.action_path }}/Run.cs
