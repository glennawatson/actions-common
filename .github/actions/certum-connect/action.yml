name: Connect Certum SimplySign
description: Connect one SimplySign session in the prebuilt signing container.
inputs:
  launch-seconds:
    description: Seconds to wait for SimplySign Desktop.
    required: false
    default: '20'
runs:
  using: composite
  steps:
  - name: Resolve prebuilt SimplySign paths
    uses: glennawatson/actions-common/.github/actions/run-csharp@main
    with:
      script-file: ${{ github.action_path }}/../certum-sign/scripts/resolve-prebuilt-simplysign-paths.cs
  - name: Start headless display
    uses: glennawatson/actions-common/.github/actions/run-csharp@main
    with:
      script-file: ${{ github.action_path }}/../certum-sign/scripts/start-headless-display.cs
  - name: Connect SimplySign (headless login)
    env:
      DISPLAY: ':99'
      LAUNCH_SECONDS: ${{ inputs.launch-seconds }}
    uses: glennawatson/actions-common/.github/actions/run-csharp@main
    with:
      script-file: ${{ github.action_path }}/../certum-sign/scripts/connect-simplysign--headless-login.cs
