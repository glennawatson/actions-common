name: Certum SimplySign signing (SafeSign)
description: |
  Sign Windows executables and installers, NuGet packages and RPMs with a Certum
  "Code Signing in the Cloud" certificate through the SafeSign .NET tool, verify
  signed NuGet packages with `dotnet nuget verify`, and optionally write SHA256SUMS.
  Run dotnet-environment first. Runs on any GitHub runner.

  Credentials are read from the environment, because composite actions cannot declare
  secret-typed inputs. Map these secrets into env on the calling job:
    CERTUM_USER_ID            SimplySign login id
    CERTUM_OTP_URI            otpauth:// URI for the SimplySign TOTP
    CERTUM_CERT_FINGERPRINT   (optional) SHA-256 fingerprint to assert against

inputs:
  packages-glob:
    description: 'Glob of .nupkg files to sign (relative to the working directory).'
    required: false
    default: ''
  nuget:
    description: 'Glob of .nupkg files to sign with SafeSign and check with dotnet nuget verify.'
    required: false
    default: ''
  authenticode:
    description: 'Glob of Windows files to sign with SafeSign (.exe, .dll, .msi, .msix).'
    required: false
    default: ''
  rpm:
    description: 'Glob of .rpm files to give IMA file signatures with SafeSign.'
    required: false
    default: ''
  checksums:
    description: 'Glob of release files; SHA256SUMS is written beside them. Runs last.'
    required: false
    default: ''
  certificate-from:
    description: 'Unused; retained for caller compatibility.'
    required: false
    default: ''
  timestamp-url:
    description: 'RFC3161 timestamp authority URL.'
    required: false
    default: 'http://time.certum.pl'

runs:
  using: composite
  steps:
    - name: Install SafeSign
      if: env.SAFESIGN_INSTALLED == ''
      shell: bash
      run: |
        dotnet tool install --global SafeSign
        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
        echo "SAFESIGN_INSTALLED=1" >> "$GITHUB_ENV"

    - name: Sign files with SafeSign
      shell: bash
      env:
        TS_URL: ${{ inputs.timestamp-url }}
        AUTHENTICODE_GLOB: ${{ inputs.authenticode }}
        NUGET_GLOB: ${{ inputs.nuget != '' && inputs.nuget || inputs.packages-glob }}
        RPM_GLOB: ${{ inputs.rpm }}
        CHECKSUMS_GLOB: ${{ inputs.checksums }}
      working-directory: ${{ runner.temp }}
      run: dotnet run --file "$GITHUB_ACTION_PATH/certum-sign.cs" -- "$TS_URL" "$AUTHENTICODE_GLOB" "$NUGET_GLOB" "$RPM_GLOB" "$CHECKSUMS_GLOB"
