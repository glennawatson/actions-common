name: Certum checksums signing
description: Write SHA256SUMS for release files and sign it with the Certum token as SHA256SUMS.p7s. Run certum-connect earlier in the job.

inputs:
  files-glob:
    description: 'Glob of the release files; SHA256SUMS and SHA256SUMS.p7s are written beside them.'
    required: true
  certificate-from:
    description: 'A file jsign signed with the same certificate (.exe, .dll, .msi or .msix); the certificate is read from it.'
    required: true

runs:
  using: composite
  steps:
    - name: Write and sign SHA256SUMS
      shell: bash
      env:
        FILES_GLOB: ${{ inputs.files-glob }}
        CERTIFICATE_FROM: ${{ inputs.certificate-from }}
      run: dotnet run --file "$GITHUB_ACTION_PATH/certum-checksums-sign.cs" -- "$FILES_GLOB" "$CERTIFICATE_FROM"
